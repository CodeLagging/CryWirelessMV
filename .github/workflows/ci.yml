name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run Ruff
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy core/ --ignore-missing-imports --no-error-summary
      - name: Audit dependencies
        run: uv run pip-audit
      - name: Run Tests
        run: uv run pytest tests/ -v --cov=core --cov-report=term-missing --cov-fail-under=10
